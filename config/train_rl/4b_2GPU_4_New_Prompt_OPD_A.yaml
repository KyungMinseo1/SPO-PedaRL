train:
  number_of_problems_per_batch: 16
  per_device_train_batch_size: 2
  num_samples_per_problem: 8

  learning_rate: 5e-7
  beta: 0.001
  mu: 2

  reward_list: ["accuracy", "pedagogical_alignment", "pedagogical_stage_alignment", "length", "end_of_conversation"]
  reward_weights: [0.3, 0.3, 0.3, 0.05, 0.05]

  normalize_tree_advantages: true
  separate_component_normalization: true

  opd_enabled: true
  opd_weight: 0.1

  accuracy_reward_gamma: 0.0

  kl_save_thresholds: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6]

teacher_model:
  model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
  lora:
    enable: true
    rank: 64
    alpha: 64
  vllm:
    temperature: 1.0
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.4
    number_of_gpus_per_instance: 1
    max_number_of_instances: -1
    load_and_unload: true
    use_v0: false
    enforce_eager: false

student_model:
  model_name_or_path: neuralmagic/Meta-Llama-3.1-8B-Instruct-FP8
  vllm:
    temperature: 0.6
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.4
    number_of_gpus_per_instance: 1
    max_number_of_instances: -1
    use_v0: false

    load_and_unload: true
    enforce_eager: false

judge_model:
  model_name_or_path: Qwen/Qwen3-30B-A3B-Instruct-2507-FP8
  vllm:
    temperature: 0.6
    max_length: 12000
    max_num_seqs: 512
    gpu_memory_utilization: 0.5
    number_of_gpus_per_instance: 1
    max_number_of_instances: -1
    load_and_unload: true
    use_awq: false
    use_v0: false
    enforce_eager: false

reward_model:
  model_name_or_path: Answer

huggingface:
  name: <huggingface_name>
  push_to_hub: false

logging:
  wandb: true
  wandb_project: train-rl-Branch_LAB
  wandb_run_name: 4B(LoRA_64)_Branch_OPD_A_2000_No_Think_New_Prompt_T_1.0
  run_group: 4b
  wandb_tags: ["4b", "opd", "groupA"]
  save_dir: checkpoints/4b_Branch_OPD_A_2000_No_Think_New_Prompt_T_1.0
  save_steps: 10

generation:
  tokenizer_to_use: Qwen/Qwen3-4B-Instruct-2507

  judges_rules_turn_prompts_paths:
    peda_integrated: prompt_templates/judges/checklist/peda_integrated.txt
    style_integrated: prompt_templates/judges/checklist/style_integrated.txt

  max_turns: 15
  branch_size: 4

  enable_self_reflect: true
  self_reflect_num_candidates: 4
  self_reflect_selection_mode: checklist_coverage
  adv_grouping_mode: A

  use_thinking: false
  force_thinking: false
  convert_think_to_turn_reward: false

  use_soft_pedagogical_reward: true
  ignore_rejected_judge: true

  use_experimental_shared_memory: false

  number_judge_attempts: 2

  n_turns_to_sample: 5

dataset:
  max_train_examples: 2000
  lower_bound_solve_rate: 0.05
  exclude_sample_ids_path: checkpoints/4b_Branch_OPD_A_2000_No_Think_New_Prompt_T_1.0/used_sample_ids.txt
  save_selected_sample_ids_path: checkpoints/4b_Branch_OPD_A_2000_No_Think_New_Prompt_T_1.0/used_sample_ids.txt
